settings:
  generate-interval: 3
  max-money-per-spawner: 100000000
  allow-merge: true
  max-level: 100
  level-multiplier: 1.0
  owner-only-gui: true
  # Tỷ lệ rơi lồng khi giết quái (0.0 -> 1.0)
  kill-drop-chance: 1.0 
  # Lệnh fallback nếu không có Vault (dùng %player% và %amount%)
  fallback-money-command: ""

