# ══════════════════════════════════════════════
#        SchoolSpawner Configuration
# ══════════════════════════════════════════════

settings:
  # Thời gian sinh tiền (giây)
  generate-interval: 3
  # Tiền tối đa của 1 spawner (tránh lag/overflow)
  max-money-per-spawner: 100000000
  # Cho phép gộp khi shift + right-click
  allow-merge: true
  # Cấp tối đa
  max-level: 100
  # Hệ số level (mỗi level nhân thêm bao nhiêu)
  # Ví dụ: level 1 = 1.0x, level 2 = 2.0x ... => multiplier = level * level-multiplier
  level-multiplier: 1.0
  # Chỉ owner hoặc admin mới mở được GUI
  owner-only-gui: true

# Format tin nhắn
messages:
  prefix: "&#FFAA00[&#FF55FFSchoolSpawner&#FFAA00] &r"
  no-permission: "&cBạn không có quyền!"
  player-only: "&cChỉ dành cho người chơi!"
  spawner-given: "&aĐã trao lồng &e%mob% &aCấp &e%level%"
  spawner-broken: "&eBạn đã nhận lồng &6%mob &7(Cấp %level%)"
  spawner-placed: "&aĐã đặt lồng &e%mob &aCấp &e%level%"
  spawner-merged: "&d✦ Gộp thành công! Lồng &e%mob &dđã lên cấp &e%level%&d!"
  merge-fail-different: "&cKhông thể gộp 2 lồng khác loại mob!"
  merge-fail-max: "&cLồng đã đạt cấp tối đa!"
  not-owner: "&cLồng này không phải của bạn!"
  money-received: "&a+ %money% &7từ lồng &e%mob"
  reload: "&aĐã reload config SchoolSpawner!"
  invalid-mob: "&cMob không hợp lệ: %mob%"
  invalid-level: "&cLevel không hợp lệ!"
  full-inventory: "&cTúi đồ đã đầy!"
  no-spawner-in-hand: "&cBạn phải cầm lồng trên tay!"

# Bảng giá theo từng loại mob (giá gốc level 1, mỗi 3 giây)
# 3$ là lồng cùi nhất (VD: Zombie, Skeleton...), 300$ là lồng xịn nhất (Wither, Ender Dragon...)
# Level nhân theo: base * level * level-multiplier
# Permission vspawner.N sẽ nhân thêm hệ số (xem file Java, nhưng tóm tắt: 2->1.2, 10->2.0)
mob-prices:
  ZOMBIE: 3
  SKELETON: 4
  SPIDER: 5
  CREEPER: 8
  SLIME: 6
  CAVE_SPIDER: 10
  ENDERMAN: 15
  BLAZE: 25
  WITCH: 20
  PILLAGER: 18
  VINDICATOR: 22
  EVOKER: 40
  RAVAGER: 60
  PIGLIN_BRUTE: 45
  HOGLIN: 50
  ZOGLIN: 55
  GUARDIAN: 30
  ELDER_GUARDIAN: 80
  SHULKER: 70
  MAGMA_CUBE: 12
  PHANTOM: 16
  HUSK: 3
  STRAY: 5
  DROWNED: 4
  ZOMBIFIED_PIGLIN: 7
  WITHER_SKELETON: 35
  GHAST: 28
  VEX: 25
  IRON_GOLEM: 100
  SNOW_GOLEM: 5
  PIG: 3
  COW: 3
  SHEEP: 3
  CHICKEN: 3
  RABBIT: 3
  VILLAGER: 50
  WITHER: 250
  ENDER_DRAGON: 300
  WARDEN: 280
  BREEZE: 32
  BOGGED: 14

# Permission multiplier: vspawner.X -> hệ số
# (Lấy cấp permission cao nhất người chơi có)
permission-multipliers:
  1: 1.0
  2: 1.2
  3: 1.3
  4: 1.4
  5: 1.5
  6: 1.6
  7: 1.7
  8: 1.8
  9: 1.9
  10: 2.0
