settings:
  generate-interval: 3
  max-money-per-spawner: 10000000
  allow-merge: true
  max-level: 1000
  level-multiplier: 1.0
  owner-only-gui: false
  kill-drop-chance: 0.5
  fallback-money-command: ""
  # Tối ưu: Tự động lưu dữ liệu lồng mỗi X giây (tính bằng giây)
  auto-save-interval: 60

messages:
  prefix: ""
  no-permission: "&#FF5555✖ Bạn không có quyền sử dụng lệnh này!"
  player-only: "&#FF5555✖ Chỉ dành cho người chơi!"
  spawner-broken: "&#55FF55✔ Bạn đã thu hồi lồng &#FFAA00%mob% &#55FF55(Cấp %level%)"
  spawner-placed: "&#55FF55✔ Đã đặt lồng &#FFAA00%mob% &#55FF55(Cấp %level%)"
  spawner-merged: "&#FF55FF✦ Gộp thành công! Lồng &#FFFF55%mob% &#FF55FFđã lên cấp &#FFAA00%level%&#FF55FF!"
  merge-fail-different: "&#FF5555✖ Không thể gộp 2 lồng khác loại mob!"
  merge-fail-max: "&#FF5555✖ Lồng đã đạt cấp tối đa!"
  not-owner: "&#FF5555✖ Lồng này không phải của bạn!"
  money-received: "&#55FF55✔ Nhận được &#FFAA00%money%$ &#55FF55từ lồng &#FFFF55%mob%"
  reload: "&#55FF55✔ Đã reload config SchoolSpawner thành công!"
  no-money: "&#FFAA00⚠ Lồng chưa sinh ra tiền, vui lòng đợi!"
  no-economy: "&#FF5555✖ Server chưa cài đặt Vault/ Economy để nhận tiền!"
  drop-spawner: "&#FF55FF✦ Bạn nhặt được lồng &#FFFF55%mob% &#FF55FFtừ quái vật!"

# Cấu hình Item Lồng (Khi cầm trên tay)
spawner-item:
  name: "&#FF60A8✦ &#FF60A8&lLỒNG SPAWNER: &#FFFFFF&l%mob% &#7F8C8D[&#FFD700Cấp %level%&#7F8C8D]"
  lore:
    - "&#7F8C8D────────────────────"
    - "&#00E5FF🔮 Loại thực thể &#808080• &#FFFFFF%mob%"
    - "&#FFD700⭐ Cấp độ lồng   &#808080• &#FFD700%level%"
    - "&#00FF7F💸 Hiệu suất     &#808080• &#00FF7F+%rate% $&#7F8C8D/3s"
    - "&#FF70A6👑 Chủ sở hữu    &#808080• &#FFFFFF%owner%"
    - "&#7F8C8D────────────────────"
    - "&#00E5FF🖱️ HƯỚNG DẪN SỬ DỤNG:"
    - "  &#FFD700➔ &#FFFFFFChuột phải &#808080• &#00FF7FMở giao diện"
    - "  &#FFD700➔ &#FFFFFFShift + Chuột phải &#808080• &#00E5FFGộp lồng"
    - "  &#FF4757➔ &#FFFFFFĐập vỡ block &#808080• &#FF4757Thu hồi lồng"
    - "&#7F8C8D────────────────────"

gui:
  title: "&#FF55FF✦ &fLồng %mob% &#AAAAAA[Cấp %level%]"
  money-item: "GOLD_INGOT"
  info-item: "BOOK"
  money-slot: 11
  info-slot: 15
  use-glass: false
  glass-item: "PURPLE_STAINED_GLASS_PANE"
  money-name: "&#00FFC8💰 &#00FFC8&lCẤT GIỮ TIỀN MẶT"
  money-lore:
    - "&#7F8C8D────────────────"
    - "&#95A5A6🪙 Tiền đã tích luỹ:"
    - "   &#00FF7F➥ &#00FF7F%money%$"
    - ""
    - "&#00E5FF⚡ Tốc độ sinh lời:"
    - "   &#00FF7F✦ &#FFFFFF+%rate% $ &#7F8C8D/ &#00FF7F3 giây"
    - "&#7F8C8D────────────────"
    - "&#FFFF55👉 &#FFFF55&lCLICK ĐỂ THU HOẠCH"

  # Nội dung hiển thị ô Thông Tin
  info-name: "&#00E5FF📖 &#00E5FF&lTHÔNG TIN LỒNG SPAWNER"
  info-lore:
    - "&#7F8C8D────────────────"
    - "&#00E5FF🔮 Loại thực thể &#808080• &#FFFFFF%mob%"
    - "&#FFD700⭐ Cấp độ lồng   &#808080• &#FFD700%level%&#7F8C8D/&#FFD700%max_level%"
    - "&#FF70A6👑 Chủ sở hữu    &#808080• &#FFFFFF%owner%"
    - "&#00FF7F💸 Hiệu suất     &#808080• &#00FF7F+%rate% $&#7F8C8D/3s"
    - "&#7F8C8D────────────────"

